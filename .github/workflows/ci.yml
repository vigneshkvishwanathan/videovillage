name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build the image and run the tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the web image
        run: docker build -t videovillage-web ./web

      - name: Run the tests inside the image
        run: docker run --rm videovillage-web pytest -v